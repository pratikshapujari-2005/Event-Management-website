<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎓 EventStream Portal</a>
            <span class="navbar-text ms-auto text-white">
                **💬 Feedback Collection Form**
            </span>
        </div>
    </nav>
    <main class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Share Your Experience</h2>
        <div class="form-section bg-white">
            <form id="feedbackForm">
                <div class="alert alert-info" role="alert">
                    Your feedback helps us enhance future college events. Thank you!
                </div>
                <div class="mb-4">
                    <label for="feedbackEvent" class="form-label">Which Event did you attend? <span class="text-danger">*</span></label>
                    <select class="form-select" id="feedbackEvent" required>
                        <option selected disabled value="">Select the event...</option>
                        <option>Annual Tech Fest 2026</option>
                        <option>College Cultural Night</option>
                        <option>Inter-College Sports Day</option>
                        <option>General Platform Feedback</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="rating" class="form-label">Overall Experience Rating (1-5 Stars) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="rating" min="1" max="5" required placeholder="Enter a number between 1 and 5">
                </div>
                <div class="mb-4">
                    <label for="comments" class="form-label">Detailed Comments/Suggestions for Improvement</label>
                    <textarea class="form-control" id="comments" rows="5" placeholder="What did you like? What can be improved?"></textarea>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" value="" id="anonymousCheck">
                    <label class="form-check-label" for="anonymousCheck">
                        Submit this feedback anonymously (name/email will not be stored).
                    </label>
                </div>
                <button type="submit" class="btn btn-info text-white btn-lg w-100">Submit Feedback</button>
                <div id="feedbackMessage" class="mt-3 text-center d-none alert alert-info fw-bold"></div>
            </form>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 EventStream Portal. Collecting Valuable Insights.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('feedbackMessage');
            messageDiv.textContent = `🙏 Thank you for your feedback! It has been recorded. Redirecting...`;
            messageDiv.classList.remove('d-none');
            this.reset();
            setTimeout(() => {
                // Redirect back to main page after success
                window.location.href = 'index.html'; 
            }, 3000);
        });
    </script>
</body>
</html>
